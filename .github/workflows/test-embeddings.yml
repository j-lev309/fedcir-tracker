name: Test Voyage AI embeddings (one-off, no commit)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call the real embed_texts()/embed_text_for_case() from update.py against real cases
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          pip install --quiet -r scripts/requirements.txt
          python3 -c "
          import sys, json, math
          sys.path.insert(0, 'scripts')
          import update as u

          print('VOYAGE_ENABLED:', u.VOYAGE_ENABLED)

          d = json.load(open('data/cases.json'))
          cases = d['cases']
          # Same three real cases used in the earlier raw-API sanity check
          names = ['Dental Monitoring', 'Etison', 'Conyers']
          picks = []
          for n in names:
              c = next((c for c in cases if n in c['case_name']), None)
              if c: picks.append(c)
          print('PICKED:', [c['case_name'] for c in picks])

          texts_and_basis = [u.embed_text_for_case(c) for c in picks]
          for (t, basis), c in zip(texts_and_basis, picks):
              print(c['case_name'], '-> basis:', basis, '| text[:80]:', t[:80])

          vectors = u.embed_texts([t for t, _ in texts_and_basis])
          print('VECTORS IS NONE:', vectors is None)
          if vectors:
              print('NUM VECTORS:', len(vectors), 'DIM:', len(vectors[0]))
              def cosine(a, b):
                  dot = sum(x*y for x, y in zip(a, b))
                  na = math.sqrt(sum(x*x for x in a)); nb = math.sqrt(sum(x*x for x in b))
                  return dot / (na * nb)
              for i in range(len(picks)):
                  for j in range(i+1, len(picks)):
                      print(f'similarity({picks[i][\"case_name\"]}, {picks[j][\"case_name\"]}) = {cosine(vectors[i], vectors[j]):.4f}')
          "
