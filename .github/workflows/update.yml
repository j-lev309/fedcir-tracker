name: Update Federal Circuit data

on:
  schedule:
    # Every day at roughly 13:00, 15:00, 17:00, 19:00, 21:00 UTC — nudged a
    # few minutes off the hour. GitHub's scheduler gets flooded with every
    # repo's cron landing on :00/:30, and silently drops some fires under
    # that load; off-the-hour minutes dodge the thundering herd.
    # CAFC dockets opinions between 8:30–11:00 a.m. ET, so the first run
    # catches the morning release and the rest sweep up stragglers.
    - cron: "6 13 * * *"
    - cron: "11 15 * * *"
    - cron: "4 17 * * *"
    - cron: "9 19 * * *"
    - cron: "14 21 * * *"
  workflow_dispatch: {}   # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write
  id-token: write   # lets the job request a GitHub OIDC token for Anthropic WIF

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch GitHub OIDC token for Anthropic (refreshed in the background)
        run: |
          fetch_token() {
            curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > /tmp/gha-jwt
          }
          fetch_token
          # GitHub's OIDC tokens expire in ~5 minutes, but this job runs
          # 10-20 minutes and the Anthropic SDK re-reads this file on every
          # token refresh — so a single fetch at the start would go stale
          # mid-run. Keep it current for the rest of the job.
          ( while true; do sleep 180; fetch_token; done ) &
          echo $! > /tmp/gha-jwt-refresh.pid

      - name: Run pipeline
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
        run: python scripts/update.py

      - name: Stop OIDC token refresh loop
        if: always()
        run: kill "$(cat /tmp/gha-jwt-refresh.pid)" 2>/dev/null || true

      - name: Commit refreshed data
        run: |
          git config user.name "fedcir-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: refresh $(date -u +%F)"
          git push
