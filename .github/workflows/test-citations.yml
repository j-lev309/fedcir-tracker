name: Test citation API shape (read-only, no commit)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query opinions-cited for a known case
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: |
          python3 -c "
          import requests, json, os

          token = os.environ['COURTLISTENER_TOKEN']
          headers = {'Authorization': f'Token {token}'}
          base = 'https://www.courtlistener.com/api/rest/v4'

          def check(label, opinion_id):
              print(f'=== {label} (opinion id {opinion_id}) ===')
              r = requests.get(f'{base}/opinions-cited/', params={'cited_opinion': opinion_id}, headers=headers, timeout=60)
              print('STATUS:', r.status_code)
              data = r.json()
              print('COUNT:', data.get('count'))
              results = data.get('results', [])
              print('RESULTS IN THIS PAGE:', len(results))
              if results:
                  print('SAMPLE RECORD:', json.dumps(results[0], indent=2))
              print()
              return results

          # Known-good sanity check from CourtListener's own docs: should return count=403
          check('Obergefell v. Hodges (docs sanity check)', 2812209)

          # Our real case: Amgen Inc. v. Amneal Pharmaceuticals LLC (2020, precedential)
          results = check('Amgen Inc. v. Amneal Pharmaceuticals LLC', 4469830)

          # Resolve a citing_opinion URL -> case name, using whichever case actually had results
          if not results:
              results = check('Obergefell (for id-resolution test)', 2812209)
          if results:
              citing_url = results[0]['citing_opinion']
              citing_id = int(citing_url.rstrip('/').split('/')[-1])
              print('Resolving citing_opinion id:', citing_id)
              r2 = requests.get(f'{base}/opinions/', params={'id': citing_id, 'fields': 'id,cluster_id,absolute_url'}, headers=headers, timeout=60)
              print('OPINIONS LOOKUP STATUS:', r2.status_code)
              op = r2.json()
              print(json.dumps(op, indent=2)[:1500])
              results_list = op.get('results', [])
              if results_list and results_list[0].get('cluster_id'):
                  clid = results_list[0]['cluster_id']
                  print()
                  print('Resolving cluster id:', clid)
                  r3 = requests.get(f'{base}/clusters/', params={'id': clid, 'fields': 'id,case_name,date_filed,absolute_url'}, headers=headers, timeout=60)
                  print('CLUSTER LOOKUP STATUS:', r3.status_code)
                  print(json.dumps(r3.json(), indent=2)[:1500])
          "
